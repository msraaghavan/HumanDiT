[project]
name = "humangen"
version = "0.1.0"
description = "HumanDiT: controllable face generation in DINOv3 representation space (RAEv2 + DiT^DH + CMuon), with one-step W-Flow and adversarial students."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "M S Raaghavan", email = "ms.raaghavan@gmail.com" }]
dependencies = [
  "torch>=2.14",
  "torchvision>=0.29",
  "numpy>=2.4",
  "einops>=0.8",
  "safetensors>=0.7",
  "huggingface-hub>=1.0",
  "pyarrow>=21",
  "pillow>=12",
  "omegaconf>=2.3",
  "tqdm>=4.67",
  "scipy>=1.18",
  "scikit-learn>=1.8",
  "transformers>=5.17",
  "tensorboard>=2.20",
]

[project.optional-dependencies]
eval = ["clean-fid>=0.1.35", "lpips>=0.1.4"]
demo = [
    "gradio>=6.28",
    "invisible-watermark>=0.2",
    "imageio[ffmpeg]>=2.37",
    "onnx>=1.20",
    "onnxruntime>=1.30",
    "onnxscript>=0.5",
    "trustmark>=0.9",
]

[dependency-groups]
dev = [
    "pytest>=9",
    "ruff>=0.15",
    "pre-commit>=4",
    "playwright>=1.55",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu130" }]
torchvision = [{ index = "pytorch-cu130" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.ruff]
line-length = 110
target-version = "py313"
extend-exclude = ["legacy/*_original.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "PERF", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "PERF401"]

[tool.ruff.lint.per-file-ignores]
"src/humangen/rae/vendor/*" = ["ALL"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["gpu: requires a CUDA device", "slow: long-running"]
