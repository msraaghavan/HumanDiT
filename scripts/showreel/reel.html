<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>HumanDiT reel</title>
<!--
  The 15-second HumanDiT reel. It speaks to two audiences at once: one big plain-English sentence per scene for anyone,
  and a small technical footnote for engineers. Every frame is a pure function of time t (window.renderAt), so
  scripts/showreel/render.py can capture it frame-accurately, with motion-blur subframes. Open with ?play to watch it in
  real time, or ?t=7.2 for one frame. Faces, timings and metrics come from scripts/showreel/build_assets.py.
-->
<style>
  :root {
    --ink: #05060b; --paper: #e9f6ff; --dim: rgba(233, 246, 255, .52); --faint: rgba(233, 246, 255, .16);
    --accent: #00e5ff; --accent2: #ff3df0;
    --sans: Bahnschrift, "DIN Alternate", "Barlow Condensed", "Arial Narrow", sans-serif;
    --mono: "Cascadia Mono", Consolas, "SF Mono", Menlo, monospace;
  }
  html, body { margin: 0; background: #000; overflow: hidden; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--ink);
           transform-origin: 0 0; font-family: var(--sans); color: var(--paper); }
  canvas, #dom { position: absolute; left: 0; top: 0; transform-origin: 50% 50%; }
  #dom, #fx { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
  .abs { position: absolute; left: 0; top: 0; will-change: transform, opacity; white-space: pre; }
  .mono { font-family: var(--mono); letter-spacing: .02em; }
  .mask { position: absolute; overflow: hidden; }
  .ltr { display: inline-block; }
  .head { position: absolute; left: 0; top: 0; white-space: normal; }
  .head .w { display: inline-block; overflow: hidden; vertical-align: top; padding: 0 .03em .1em 0; margin-right: .22em;
             position: relative; z-index: 1; }
  .head .w > span { display: inline-block; }
  .head .hl { position: absolute; height: .13em; background: var(--accent); transform-origin: 0 50%; z-index: 0;
              box-shadow: 0 0 18px var(--accent), 0 0 42px rgba(0, 229, 255, .45); }
  [style*="var(--accent)"] { text-shadow: 0 0 18px rgba(0, 229, 255, .65), 0 0 44px rgba(0, 229, 255, .3); }
  [style*="var(--accent2)"] { text-shadow: 0 0 16px rgba(255, 61, 240, .6); }
  .chip { position: absolute; width: 262px; height: 66px; border: 1.5px solid var(--faint); border-radius: 12px;
          box-sizing: border-box; overflow: hidden; }
  .chip .fill { position: absolute; inset: 0; background: linear-gradient(90deg, var(--accent), #7c9dff);
                transform-origin: 0 50%; box-shadow: 0 0 26px rgba(0, 229, 255, .55); }
  .chip .name { position: absolute; left: 20px; top: 16px; font-size: 29px; font-variation-settings: "wdth" 85, "wght" 500; }
  .chip .p { position: absolute; right: 16px; top: 19px; font-size: 25px; font-variation-settings: "wdth" 80, "wght" 600; }
  .glass { position: absolute; background: rgba(5, 6, 11, .7); backdrop-filter: blur(22px) saturate(1.2);
           border: 1px solid rgba(233, 246, 255, .14); border-radius: 22px; }
  .bar { position: absolute; height: 20px; border-radius: 10px; }
  #vignette { position: absolute; inset: 0; pointer-events: none;
              background: radial-gradient(ellipse at 50% 48%, rgba(0,0,0,0) 55%, rgba(0,0,0,.55) 100%); }
  .scrim { position: absolute; left: 0; width: 1920px; height: 150px; pointer-events: none; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" width="1920" height="1080"></canvas>
  <div id="dom"></div>
  <div class="scrim" style="top:0;background:linear-gradient(rgba(5,6,11,.75),rgba(5,6,11,0))"></div>
  <div class="scrim" style="bottom:0;background:linear-gradient(rgba(5,6,11,0),rgba(5,6,11,.8))"></div>
  <div id="vignette"></div>
  <div id="fx"></div>
  <div id="hud"></div>
</div>
<script>
"use strict";
const T = 15, FPS = 30, W = 1920, H = 1080;
const ASSETS = "../../runs/showreel/assets/";
const ATTRS = ["Male", "Eyeglasses", "Hat", "Goatee", "Sideburns", "Beard", "Lipstick", "Gray_Hair", "Bangs",
               "Blond_Hair", "Smiling", "Mouth_Open"];
const PLAIN = { Male: "Man", Eyeglasses: "Glasses", Hat: "Hat", Goatee: "Goatee", Sideburns: "Sideburns", Beard: "Beard",
                Lipstick: "Lipstick", Gray_Hair: "Grey hair", Bangs: "Bangs", Blond_Hair: "Blond hair",
                Smiling: "Smile", Mouth_Open: "Open mouth" };
const SCENES = [[0, "START"], [2.5, "DRAW"], [5, "CHOOSE"], [8, "SPEED"], [10.5, "REALISM"], [13, "HUMANDiT"]];

// ---------------------------------------------------------------- maths
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, u) => a + (b - a) * u;
const E = {
  lin: u => u,
  outExpo: u => (u >= 1 ? 1 : 1 - Math.pow(2, -10 * u)),
  inExpo: u => (u <= 0 ? 0 : Math.pow(2, 10 * u - 10)),
  inOutExpo: u => (u <= 0 ? 0 : u >= 1 ? 1 : u < .5 ? Math.pow(2, 20 * u - 10) / 2 : (2 - Math.pow(2, -20 * u + 10)) / 2),
  outCubic: u => 1 - Math.pow(1 - u, 3),
  inCubic: u => u * u * u,
  inOutCubic: u => (u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2),
  outQuint: u => 1 - Math.pow(1 - u, 5),
  outBack: u => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(u - 1, 3) + c1 * Math.pow(u - 1, 2); },
};
const tw = (t, a, b, ease = E.outExpo) => ease(seg(t, a, b));   // eased 0..1 over [a, b]
const hash = (i, j = 0) => { const x = Math.sin(i * 127.1 + j * 311.7 + 74.7) * 43758.5453; return x - Math.floor(x); };
const wrap = t => ((t % T) + T) % T;
const OMEGA = 2 * Math.PI * 18 / T;           // shimmer frequency that is exactly periodic over the loop
const live = (t, a, b) => t >= a && t < b;

// ---------------------------------------------------------------- DOM helpers
const dom = document.getElementById("dom"), hudEl = document.getElementById("hud"), fxEl = document.getElementById("fx");
function el(parent, cls, text = "", style = {}) {
  const e = document.createElement("div");
  e.className = cls;
  if (text) e.textContent = text;
  Object.assign(e.style, style);
  parent.appendChild(e);
  return e;
}
function place(e, x, y, o = 1, s = 1, extra = "") {
  e.style.transform = `translate(${x}px, ${y}px) scale(${s}) ${extra}`;
  e.style.opacity = o;
}
function letters(parent, text, cls, style) {        // a line of per-letter spans inside a clipping mask
  const m = el(parent, "mask abs", "", style);
  const spans = [...text].map(ch => el(m, "ltr " + (cls || ""), ch === " " ? " " : ch));
  return { m, spans };
}
// a plain-English headline: each word rises out of its own mask; `hi` words get a marker sweep underneath
function headline(parent, text, style, hi = []) {
  const box = el(parent, "head", "", style);
  const words = text.split(" ").map(w => { const m = el(box, "w"); const s = document.createElement("span"); s.textContent = w; m.appendChild(s); return { m, s }; });
  const px = parseFloat(style.fontSize);
  const bars = hi.map(i => {
    const w = words[i].m, b = el(box, "hl"), nx = words[i + 1]?.m;
    const joined = hi.includes(i + 1) && nx && nx.offsetTop === w.offsetTop;
    const width = joined ? nx.offsetLeft - w.offsetLeft : w.offsetWidth - .03 * px;
    Object.assign(b.style, { left: `${w.offsetLeft}px`, top: `${w.offsetTop + w.offsetHeight - .2 * px}px`, width: `${width}px` });
    return { b, i };
  });
  return { box, words, bars };
}
function showHead(h, t, tIn, tOut, x, y, stagger = .05) {
  const on = t >= tIn - .01 && t < tOut + .6;
  place(h.box, x, y, on ? 1 : 0);
  if (!on) return;
  h.words.forEach(({ s }, i) => {
    const a = tw(t, tIn + i * stagger, tIn + i * stagger + .6), b = tw(t, tOut + i * stagger * .4, tOut + i * stagger * .4 + .32, E.inExpo);
    s.style.transform = `translateY(${(1 - a) * 108 - b * 108}%)`;
  });
  h.bars.forEach(({ b, i }, k) => {
    const g = tw(t, tIn + .5 + i * stagger + k * .12, tIn + .95 + i * stagger + k * .12, E.inOutCubic);
    const o = tw(t, tOut, tOut + .25, E.inCubic);
    b.style.transform = `scaleX(${g * (1 - o)})`;
    h.words[i].s.style.color = g > .6 ? "var(--accent)" : "var(--paper)";
  });
}
const GLYPHS = "01#%&*+=<>/\\|_-:;░▒▓";
function scramble(e, text, u, t) {                  // decode-in: random glyphs resolve to the text, left to right
  if (u >= 1) { e.textContent = text; return; }
  const n = text.length, f = Math.round(t * FPS);
  let s = "";
  for (let i = 0; i < n; i++) {
    const r = (i / n) * .65, ch = text[i];
    if (ch === " " || u > r + .35) s += u > r + .35 ? ch : " ";
    else if (u > r) s += GLYPHS[Math.floor(hash(i, f) * GLYPHS.length)];
    else s += " ";
  }
  e.textContent = s;
}
function odometer(parent, digits, style) {           // rolling digit columns
  const box = el(parent, "abs", "", style);
  const cols = [];
  for (let d = 0; d < digits; d++) {
    const m = el(box, "mask", "", { position: "relative", display: "inline-block", height: "1em", width: ".56em",
                                    verticalAlign: "top" });
    const strip = el(m, "", "", { position: "absolute", left: 0, top: 0, width: "100%", textAlign: "center" });
    strip.innerHTML = [...Array(11).keys()].map(k => `<div style="height:1em;line-height:1em">${k % 10}</div>`).join("");
    cols.push(strip);
  }
  return { box, set(v) {                              // v: float; the last digit rolls continuously
    const iv = Math.floor(v), fr = v - iv;
    for (let d = 0; d < digits; d++) {
      const p = Math.pow(10, digits - 1 - d), dig = Math.floor(iv / p) % 10;
      const carry = d === digits - 1 ? fr : (iv % p === p - 1 ? fr : 0);
      cols[d].style.transform = `translateY(${-(dig + carry)}em)`;
    }
  } };
}

// ---------------------------------------------------------------- assets
const img = src => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = ASSETS + src; });
const pad = n => String(n).padStart(2, "0");
let M, TRAJ, EDIT, GRID, MORPH, DCGAN, TOK_NOISE, TOK_STEPS;

// ---------------------------------------------------------------- canvas painters
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
function mix(a, b, u) { const o = new Float32Array(a.length); for (let i = 0; i < a.length; i++) o[i] = a[i] + (b[i] - a[i]) * u; return o; }
function tokensAt(k) {                                   // token colours at fractional ODE step k
  const i = clamp(Math.floor(k), 0, TOK_STEPS.length - 1), j = Math.min(i + 1, TOK_STEPS.length - 1);
  return mix(TOK_STEPS[i], TOK_STEPS[j], clamp(k - i));
}
// 16x16 mosaic: gap = fraction of the pitch left empty; fn(r, c) -> {s: scale, k: brightness, a: alpha}
function mosaic(cols, x, y, size, gap, fn) {
  const n = 16, p = size / n;
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
    const o = fn ? fn(r, c) : {};
    const s = (o.s ?? 1) * p * (1 - gap), k = o.k ?? 1, a = o.a ?? 1;
    if (a <= 0.003 || s <= .2) continue;
    const i = (r * n + c) * 3;
    ctx.fillStyle = `rgba(${cols[i] * k | 0},${cols[i + 1] * k | 0},${cols[i + 2] * k | 0},${a})`;
    ctx.fillRect(x + c * p + (p - s) / 2, y + r * p + (p - s) / 2, s, s);
  }
}
function face(im, x, y, size, alpha = 1, pixelated = false) {
  if (alpha <= 0.003) return;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.imageSmoothingEnabled = !pixelated;
  ctx.imageSmoothingQuality = "high";
  ctx.drawImage(im, x, y, size, size);
  ctx.restore();
}
function frameLine(x, y, w, h, a, color = "rgba(233,246,255,.22)") {   // hairline frame with corner ticks
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a; ctx.strokeStyle = color; ctx.lineWidth = 1.5;
  ctx.strokeRect(x - 12, y - 12, w + 24, h + 24);
  ctx.strokeStyle = "rgba(233,246,255,.9)"; ctx.lineWidth = 2.5; const L = 22;
  for (const [cx, cy, dx, dy] of [[x - 12, y - 12, 1, 1], [x + w + 12, y - 12, -1, 1], [x - 12, y + h + 12, 1, -1], [x + w + 12, y + h + 12, -1, -1]]) {
    ctx.beginPath(); ctx.moveTo(cx, cy + dy * L); ctx.lineTo(cx, cy); ctx.lineTo(cx + dx * L, cy); ctx.stroke();
  }
  ctx.restore();
}
function ring(cx, cy, r, u, a) {                        // progress ring (the ODE steps)
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a; ctx.lineCap = "round";
  ctx.strokeStyle = "rgba(233,246,255,.12)"; ctx.lineWidth = 10;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
  ctx.strokeStyle = "#00e5ff"; ctx.lineWidth = 10;
  ctx.beginPath(); ctx.arc(cx, cy, r, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * u); ctx.stroke();
  const ang = -Math.PI / 2 + Math.PI * 2 * u;               // the leading dot
  ctx.fillStyle = "#e9f6ff"; ctx.beginPath(); ctx.arc(cx + r * Math.cos(ang), cy + r * Math.sin(ang), 9, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

// ---------------------------------------------------------------- layout constants
const G1 = { x: 1180, y: 200, s: 640, gap: .15 };          // the noise grid (scene 1 and the loop point)
const F2 = { x: 170, y: 250, s: 600 };                      // the hero face in scenes 2-3
const F6 = { x: 730, y: 112, s: 460 };                      // the face on the end card
const TILE = 160, GY = 60;                                  // scene-4 grid: 12 x 6 tiles of 160 px
const STEP_T0 = 2.7, STEP_T1 = 4.6;                         // the 25 ODE steps play between these times
const EDIT_T = [5.5, 6.0, 6.5, 7.0];                        // attribute switches, on the beat
const SHUT = 10.38;                                         // the shutter wipe into scene 5
const stepAt = t => E.inOutCubic(seg(t, STEP_T0, STEP_T1)) * 24;
const RC = { x: 1210, y: 560, r: 150 };                     // the step ring, scene 2
const METER = { x: 1040, y: 690, w: 760 };                  // the realism meter, scene 5
const meterX = v => METER.x + METER.w * clamp(Math.log10(Math.max(v, 1)) / Math.log10(300));

// ---------------------------------------------------------------- build the DOM (once)
const X = {};
function build() {
  const big = (px, wdth = 85, wght = 600) => ({ fontSize: `${px}px`, lineHeight: "1.08", fontVariationSettings: `"wdth" ${wdth}, "wght" ${wght}` });
  // HUD
  X.hudL = el(hudEl, "abs mono", "HUMANDiT  /  SHOWREEL", { fontSize: "17px", letterSpacing: ".28em", color: "var(--paper)" });
  X.tc = el(hudEl, "abs mono", "", { fontSize: "17px", letterSpacing: ".12em" });
  X.scene = el(hudEl, "abs mono", "", { fontSize: "16px", letterSpacing: ".22em", color: "var(--dim)" });
  X.prog = el(hudEl, "abs", "", { width: "260px", height: "2px", background: "var(--faint)" });
  X.progFill = el(X.prog, "", "", { position: "absolute", left: 0, top: 0, height: "2px", width: "260px", background: "var(--accent)", transformOrigin: "0 0" });
  X.note = el(hudEl, "abs", "Every face in this video was invented by the AI. Every number is measured.",
              { fontSize: "21px", color: "var(--dim)", fontVariationSettings: '"wdth" 90, "wght" 400' });

  // scene 1: start
  X.t1 = letters(dom, "HumanDiT", "", { fontSize: "210px", lineHeight: "1", height: "215px", left: "96px", top: "250px",
                                          fontVariationSettings: '"wdth" 100, "wght" 600' });
  X.t1.spans.slice(5).forEach(s => (s.style.color = "var(--accent)"));
  X.h1 = headline(dom, "An AI that invents faces of people who don't exist.", { ...big(62, 90, 500), width: "900px" }, [8, 9]);
  X.g1 = headline(dom, "It starts from pure random static.", { ...big(36, 90, 500), width: "640px" }, [4, 5]);
  X.tech1 = el(dom, "abs mono", "", { fontSize: "18px", color: "var(--accent2)" });

  // scene 2: draw
  X.h2 = headline(dom, "It cleans up the static, one step at a time.", { ...big(72), width: "900px" }, [5, 6, 7, 8, 9]);
  X.stepLbl = el(dom, "abs", "STEP", { fontSize: "30px", letterSpacing: ".3em", color: "var(--dim)", fontVariationSettings: '"wdth" 90, "wght" 500' });
  X.odo = odometer(dom, 2, { fontSize: "150px", lineHeight: "1", fontVariationSettings: '"wdth" 75, "wght" 600', fontFeatureSettings: '"tnum"' });
  X.of25 = el(dom, "abs", "of 25", { fontSize: "34px", color: "var(--dim)", fontVariationSettings: '"wdth" 85, "wght" 500' });
  X.sk = el(dom, "abs", "its rough inner sketch", { fontSize: "26px", color: "var(--accent2)", fontVariationSettings: '"wdth" 85, "wght" 500' });
  X.tech2 = el(dom, "abs mono", "", { fontSize: "18px", color: "var(--dim)" });

  // scene 3: choose
  X.h3 = headline(dom, "You pick the details.", { ...big(76), width: "900px" }, [3]);
  X.s3 = headline(dom, "Same face. Add glasses, a smile, grey hair, bangs.", { ...big(34, 90, 400), width: "860px" }, []);
  X.chips = ATTRS.map(n => {
    const c = el(dom, "chip abs");
    c.fill = el(c, "fill");
    c.nm = el(c, "name", PLAIN[n]);
    c.p = el(c, "p", "");
    return c;
  });
  X.chk = headline(dom, "✓ = a second AI checked the face and agrees", { ...big(28, 90, 400), width: "860px" }, []);
  X.tech3 = el(dom, "abs mono", "", { fontSize: "17px", color: "var(--dim)" });

  // scene 4: speed
  X.glass = el(dom, "glass abs", "", { width: "1180px", height: "520px" });
  X.k4 = el(X.glass, "abs", "TURBO MODE", { fontSize: "26px", letterSpacing: ".3em", left: "60px", top: "44px", color: "var(--dim)", fontVariationSettings: '"wdth" 90, "wght" 500' });
  X.sec = el(X.glass, "abs", "", { fontSize: "160px", lineHeight: "1", left: "54px", top: "84px", color: "var(--accent)",
                                   fontVariationSettings: '"wdth" 75, "wght" 600', fontFeatureSettings: '"tnum"' });
  X.secU = el(X.glass, "abs", "seconds\nper face", { fontSize: "36px", lineHeight: "1.05", left: "400px", top: "118px", fontVariationSettings: '"wdth" 85, "wght" 500' });
  X.faster = el(X.glass, "abs", "", { fontSize: "92px", lineHeight: "1", left: "700px", top: "92px", transformOrigin: "0 50%", color: "var(--accent)", fontVariationSettings: '"wdth" 75, "wght" 600' });
  X.fasterL = el(X.glass, "abs", "faster than careful mode", { fontSize: "26px", left: "704px", top: "190px", color: "var(--dim)", fontVariationSettings: '"wdth" 85, "wght" 500' });
  X.barT = el(X.glass, "bar", "", { left: "60px", top: "300px", background: "var(--paper)" });
  X.barS = el(X.glass, "bar", "", { left: "60px", top: "372px", background: "var(--accent)" });
  X.barTl = el(X.glass, "abs", "", { fontSize: "24px", left: "60px", top: "262px", color: "var(--paper)", fontVariationSettings: '"wdth" 90, "wght" 500' });
  X.barSl = el(X.glass, "abs", "", { fontSize: "24px", left: "60px", top: "334px", color: "var(--paper)", fontVariationSettings: '"wdth" 90, "wght" 500' });
  X.barTv = el(X.glass, "abs mono", "", { fontSize: "21px", top: "298px" });
  X.barSv = el(X.glass, "abs mono", "", { fontSize: "21px", top: "370px", color: "var(--accent)" });
  X.c4 = el(X.glass, "abs", "72 faces. None of them real. None hand-picked. Turbo trades a little detail for speed.",
            { fontSize: "26px", left: "60px", top: "420px", fontVariationSettings: '"wdth" 88, "wght" 400' });
  X.tech4 = el(X.glass, "abs mono", "", { fontSize: "15px", left: "60px", top: "468px", color: "var(--dim)" });
  X.shutter = [...Array(10)].map(() => el(fxEl, "abs", "", { width: "193px", height: "1080px", background: "var(--accent)", transformOrigin: "50% 0" }));

  // scene 5: realism
  X.h5 = headline(dom, "How real do they look?", { ...big(76), width: "1100px" }, [1]);
  X.before = el(dom, "abs", "BEFORE\nthis project's first version", { fontSize: "24px", lineHeight: "1.2", color: "var(--dim)", fontVariationSettings: '"wdth" 88, "wght" 500' });
  X.after = el(dom, "abs", "AFTER\nHumanDiT", { fontSize: "24px", lineHeight: "1.2", color: "var(--dim)", fontVariationSettings: '"wdth" 88, "wght" 500' });
  X.fidL = el(dom, "abs", "Realism gap: lower means closer to real photos", { fontSize: "30px", color: "var(--paper)", fontVariationSettings: '"wdth" 88, "wght" 500' });
  X.fid = el(dom, "abs", "", { fontSize: "230px", lineHeight: "1", fontVariationSettings: '"wdth" 75, "wght" 600', fontFeatureSettings: '"tnum"' });
  X.mL = el(dom, "abs", "real photos", { fontSize: "22px", color: "var(--paper)", fontVariationSettings: '"wdth" 88, "wght" 500' });
  X.mR = el(dom, "abs", "unrealistic", { fontSize: "22px", color: "var(--dim)", fontVariationSettings: '"wdth" 88, "wght" 500' });
  X.mB = el(dom, "abs", "", { fontSize: "22px", color: "var(--dim)", fontVariationSettings: '"wdth" 88, "wght" 500' });
  X.stats = [0, 1, 2, 3].map(() => {
    const s = el(dom, "abs", "", { width: "400px", height: "140px", borderTop: "2px solid var(--faint)" });
    s.v = el(s, "abs", "", { top: "16px", fontSize: "62px", fontVariationSettings: '"wdth" 80, "wght" 600' });
    s.l = el(s, "abs", "", { top: "88px", fontSize: "23px", lineHeight: "1.15", whiteSpace: "pre", color: "var(--dim)", fontVariationSettings: '"wdth" 88, "wght" 400' });
    return s;
  });
  X.tech5 = el(dom, "abs mono", "", { fontSize: "16px", color: "var(--dim)" });

  // scene 6: end card

// ---------------------------------------------------------------- the timeline

// ---------------------------------------------------------------- audio cue sheet (read by render.py)
function cueSheet() {
  const cues = [{ t: 2.5, t1: 13.0, kind: "pulse" }];
  SCENES.slice(1).forEach(([t0]) => cues.push({ t: t0, kind: "impact" }));
  cues.push({ t: 0.15, kind: "title" });
  [2.5, 8.0, 13.0].forEach(t0 => cues.push({ t: t0 - 1.1, kind: "riser", dur: 1.1 }));
  for (let s = 2; s <= 25; s++) {                            // one tick per ODE step
    let lo = STEP_T0, hi = STEP_T1;
    for (let it = 0; it < 40; it++) { const mid = (lo + hi) / 2; if (stepAt(mid) + 1 >= s) hi = mid; else lo = mid; }
    cues.push({ t: hi, kind: "tick", v: s / 25 });
  }
  EDIT_T.forEach((te, i) => cues.push({ t: te, kind: "swipe", v: i }));
  for (let r = 0; r < 6; r++) for (let c = 0; c < 12; c++) {
    const d = Math.hypot(c - 4, r);
    if (r * 12 + c !== 4) cues.push({ t: 8.0 + d * .042, kind: "pop", pan: (c - 5.5) / 6, v: hash(r, c) });
  }
  cues.push({ t: 8.75, kind: "fall", dur: .7 });
  cues.push({ t: 9.2, kind: "race", dur: 1.0 }); cues.push({ t: 9.5, kind: "chime" });
  cues.push({ t: SHUT - .05, kind: "shutter", dur: .5 });
  cues.push({ t: 11.0, kind: "fall", dur: 1.1 }); cues.push({ t: 12.05, kind: "chime" });
  [0, 1, 2, 3].forEach(i => cues.push({ t: 11.45 + i * .1, kind: "blip", v: i }));
  cues.push({ t: 13.2, kind: "bell" }); cues.push({ t: 14.3, kind: "reverse", dur: .7 });
  return cues.sort((a, b) => a.t - b.t);
}

  M = await (await fetch(ASSETS + "manifest.json")).json();
  M.chain = M.edits[M.edits.length - 1].on;
  M.probeAt = (t, name) => {                                 // the probe's verdict on the image currently shown
    let cur = 0; EDIT_T.forEach((te, i) => { if (t >= te + .16) cur = i + 1; });
    return cur > 0 && M.edits[cur].on.includes(name) ? M.edits[cur].probe[name] : null;
  };
  const q = (n, f) => Promise.all([...Array(n).keys()].map(f));
  [TRAJ, EDIT, GRID, MORPH, DCGAN] = await Promise.all([
    q(M.trajectory_steps, i => img(`traj_${pad(i)}.png`)),
    q(M.edits.length, i => img(`edit_${i}.png`)),
    q(M.grid_seeds[1] + 1, i => img(`grid_${pad(i)}.png`)),
    q(M.morph.frames, i => img(`morph_${pad(i)}.png`)),
    img("dcgan.png"),
  ]);
  TOK_NOISE = Float32Array.from(M.tokens.noise, v => clamp(128 + (v - 128) * 1.7, 0, 255));
  TOK_STEPS = M.tokens.steps.map(a => Float32Array.from(a));
  await document.fonts.ready;
  build();
  window.renderAt = renderAt;
  window.CUES = cueSheet();
  const P = new URLSearchParams(location.search);
  const fit = () => { const s = Math.min(innerWidth / W, innerHeight / H); document.getElementById("stage").style.transform = `scale(${s})`; };
  if (!P.has("render")) { fit(); addEventListener("resize", fit); }
  if (P.has("play")) {
    const t0 = performance.now();
    const loop = () => { renderAt((performance.now() - t0) / 1000); requestAnimationFrame(loop); };
    loop();
  } else renderAt(parseFloat(P.get("t") || "0"));
  return true;
})();
</script>
</body>
